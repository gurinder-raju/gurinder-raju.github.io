Balancing Brain and Machine
===

Prioritize human intelligence alongside AI tools for productivity.

```text +no_background
                       ┃

       │               ┃               │
  ╭────┴────╮          ┃          ╭────┴────╮

  │  human  │          ┃          │   AI    │

                 ━━━━━━┻━━━━━━
```

<!-- end_slide -->

Aligning Priorities
===

Think of the typical roles that make up a team.

```text +no_background
      ┌─────┐                  ┌─────┐
      │ SDM │                  │ SDE │
      └──┬──┘                  └──┬──┘

                ┏━━┷━━━━┷━━┓
                ┃   TPM    ┃
                ┗━━┯━━━━┯━━┛

      ┌──┴──┐                  ┌──┴──┐
      │ UX  │                  │ PM  │
      └─────┘                  └─────┘
```

Human intelligence is very critical for the TPM role.

<!-- end_slide -->

Aligning Priorities
===

### Why Is It So Hard?

Organization-wide goals get divided into smaller goals. The success tends to get measured locally.

```text +no_background
         ╔═════════════════════════════════════╗
         ║         organizational goal         ║
         ╚══════════════════╤══════════════════╝
       ┌────────────────────┼────────────────────┐
  ┌────┴─────┐         ┌────┴─────┐         ┌────┴─────┐
  │  goal A  │         │  goal B  │         │  goal C  │
  └────┬─────┘         └────┬─────┘         └────┬─────┘
  ┌────┴─────┐         ┌────┴─────┐         ┌────┴─────┐
  │ measured │         │ measured │         │ measured │
  │ locally  │         │ locally  │         │ locally  │
  └──────────┘         └──────────┘         └──────────┘
```

<!-- end_slide -->

Aligning Priorities
===

### Why Is It So Hard?

Humans want to protect the work they have familiarity with. They want to protect the success that will be measured locally. It's a very human emotional defense mechanism.

```text +no_background
  ┌──────────────────────┐     ┌──────────────────────┐
  │ work they have       │     │ success that will be │
  │ familiarity with     │     │ measured locally     │
  └──────────────────────┘     └──────────────────────┘
```

<!-- end_slide -->

### Why Is It So Hard?

Meet Lots Of Humans
===

### Practical Tip #1

Rule of thumb: meet at least one new human you haven't met before one-on-one every week.

```text +no_background
  week    mon    tue    wed    thu    fri
  ────    ───    ───    ───    ───    ───
   01             ●
   02                           ●
   03      ●
   04                    ●
   05                                  ●
  ──────────────────────────────────────────
  ● one-on-one with a human you haven't met
```

Reach out with curiosity. It's not a transaction. It's your curiosity to know them.

<!-- end_slide -->

Ask About Goals
===

### Practical Tip #2

Ask humans about what goals they are focusing on. It's a great question. Whether the human on the other side is an SDM, Director, SVP, or the CEO.

```text +no_background
  "what goals are you focusing on?"

  ┌─────┐   ┌──────────┐   ┌─────┐   ┌─────┐
  │ SDM │   │ Director │   │ SVP │   │ CEO │
  └─────┘   └──────────┘   └─────┘   └─────┘
```

It sets a great stage for outcome focused forward looking conversations.

<!-- end_slide -->

Align Goals
===

### Practical Tip #3

Align, Align, Align. Individual Goals, Team Goals, and Business Goals. Identify 2-fers.

```text +no_background
  ┌────────────────────┐       ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
  │                    │       ┃  2-fer                        ┃
  │  individual goals  │       ┃                               ┃
  │  team goals        │ ────▶ ┃  operational excellence       ┃
  │  business goals    │       ┃  + margin improvement         ┃
  │                    │       ┃  (shutting down a component)  ┃
  └────────────────────┘       ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
```

Takes practice. But that's where the magic happens.

<!-- end_slide -->

Segment Your Work
===

### Practical Tip #4

Develop deeper understanding of your time spend. Get a clearer picture of different segments:

```text +no_background
 ┌──────────────┬───────────┬───────────────────┬─────────────┐
 │ Team Reviews │ Reporting │ Artifact Creation │ Discussions │
 └──────┬───────┴─────┬─────┴─────────┬─────────┴──────┬──────┘
        └─────────────┴───────┬───────┴────────────────┘
                   ┌──────────┴──────────┐
          non-human segments       human segments
                   │                     │
                   ▼                     ▼
         agentification plan     keep your eye here
```

Develop a plan for agentification of the non-human segments over the next year. Don't take your eye off the human segments.

<!-- end_slide -->

Use AI To Construct Your Arguments
===

### Practical Tip #5

Use AI To Feed Your Human Intelligence. Use AI To Construct Your Stance, Positioning, and Oral Arguments.

```text +no_background
╭─ ai ─────────────────────────────────────────────────╮
│ > construct my stance and positioning on this        │
│ > build the oral argument for the review             │
│ > what would X say?                                  │
│ > what are the questions I can ask?                  │
│ > how do I give this tough feedback?                 │
╰──────────────────────────────────────────────────────╯
```

A well constructed argument can settle debates quickly.

<!-- end_slide -->

Use AI As Conversational Assistant
===

### Practical Tip #6

Use your semi structured thoughts to distill clarity and learnings for you. Reflect on a tough review. Learn a completely new topic.

```text +no_background
  semi-structured thoughts
  ▁▃▅▂▇▃▁▅▂▆▃▁▄▇▂▅▃▁▆▂▄   (audio, or text)
            │
            ▼
       ╭─ ai ─╮
       ╰──┬───╯
          ├──▶  clarity and learnings
          ├──▶  reflect on a tough review
          └──▶  learn a new topic  (private equity, stablecoins)
```

If the AI tools available to you don't support audio, use the text version. It's a little more work, but worth it.

<!-- end_slide -->

Personalize
===

### Practical Tip #7

Focus on quality of the artifacts you create with AI. At the same time, you need to personalize it.

```text +no_background
  AI output          your context        your artifact
 ┌────────────────┐  ┌────────────────┐  ┏━━━━━━━━━━━━━━━━┓
 │░░░░░░░░░░░░░░░░│  │ writing style  │  ┃▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓┃
 │  AI generated  │+ │ your dictionary│= ┃▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓┃
 │    content     │  │ unique voice   │  ┃your fingerprint┃
 └────────────────┘  └────────────────┘  ┗━━━━━━━━━━━━━━━━┛
                     ◀── iterate on the same document ──┘
```

People need to consume it with your fingerprint. Tailor the output with your unique voice. Develop the context of your writing style and use it with agents to guide them.

<!-- end_slide -->

Be Aware Of Your Adeptness
===

### Practical Tip #8

```text +no_background
   aware               explorer               native
     ●━━━━━━━━━━━━━━━━━━━━━●━━━━━━━━━━━━━━━━━━━━━━○
     ╰───── most people ─────╯                 rare feat
                                                  ▲
                                           your north star
```

Understand the bar and adjust your north star. Push your imagination on native AI usage in all non-human segments.

<!-- end_slide -->

Being AI Native
===

Understand what it takes to be AI Native.

- Ask the question on how you can leverage AI while picking up work in a non-human segment.
- Understand the evolving AI capabilities and features of all tools that you use for your work.
- **Push AI Hard.** Don't just use AI for writing and learnings. Push it to think deeper, analyze, and help you with your hardest challenges.

```text +no_background
  hardest challenges   ▕████████████████████████▏
  analyze              ▕███████████████████     ▏
  think deeper         ▕██████████████          ▏

Use AI For Change Management
===

### Practical Tip #9

Humans are bad at processing changes and understanding the cascading implications. Feed status reports from your dependencies, your programs, and let AI process it. Don't ask what changed, but how does that impact you and your goals.

```text +no_background
 ┌ dependencies ┐   status    ╭──────╮
 ├ programs     ┼───────────▶ │  ai  │
 └ ...          ┘   reports   ╰──┬───╯
                                 │
        ✗  what changed?  ◀──────┤
        ✓  how does that  ◀──────┘
           impact me and my goals?
```

Open blind spots that can otherwise lead to late surprises.

### Practical Tip #10

KPI (Key Performance Indicators) help create objective direction for you and your dependencies. It uplevels the conversations from differing human opinions to measurable alignment.

                       └────────────────────────┘
```

Use more advanced research agents to develop KPIs for your most demanding programs. Iterate and tune.

<script>
(() => {
  "use strict";

  // ── tiny renderer for the presenterm markdown subset used in slides.md ──
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\s)((?:linkedin\.com|github\.com)\/[\w\-./]+)/g, '$1<a href="https://$2">$2</a>');
  const HEAVY = /[━┃┏┓┗┛┳┻┣┫╋┷┯▲▶✓]+/g;
  const grid = s => esc(s).replace(HEAVY, m => `<span class="hv">${m}</span>`).replace(/✗/g, '<span class="no">✗</span>');

  function renderSlide(src) {
    const lines = src.replace(/\s+$/, "").split("\n");
    const out = [];            // html chunks for current container
    let cols = null, col = -1; // column layout state
    const flags = { middle: false };
    let para = [], list = null;

    const push = h => (cols ? cols[col] : out).push(h);
    const flushPara = () => {
      if (!para.length) return;
      const html = para.map(l => l.endsWith("\\") ? inline(l.slice(0, -1)) + "<br>" : inline(l) + " ").join("").trim();
      push(`<p>${html}</p>`); para = [];
    };
    const flushList = () => {
      if (!list) return;
      const start = list.start ? ` style="--start:${list.start - 1}"` : "";
      push(`<${list.tag}${start}>${list.items.map(i => `<li><span>${inline(i)}</span></li>`).join("")}</${list.tag}>`);
      list = null;
    };
    const flush = () => { flushPara(); flushList(); };

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const dir = line.match(/^<!--\s*([\w_]+)(?::\s*(.*?))?\s*-->$/);
      if (dir) {
        flush();
        const [, name, arg] = dir;
        if (name === "jump_to_middle") { flags.middle = true; push('<div class="spacer"></div>'); }
        else if (name === "column_layout") { cols = JSON.parse(arg).map(() => []); col = 0; }
        else if (name === "column") col = Number(arg);
        else if (name === "reset_layout" && cols) { out.push(`<div class="cols">${cols.map(c => `<div>${c.join("")}</div>`).join("")}</div>`); cols = null; }
        continue; // pause, speaker_note, new_lines: no-ops on the web
      }
      if (/^```/.test(line)) {
        flush();
        const body = [];
        while (++i < lines.length && !/^```\s*$/.test(lines[i])) body.push(lines[i]);
        const text = body.join("\n");
        if (/█/.test(text) && !/[a-z]/i.test(text)) push(`<pre class="figlet print" aria-hidden="true">${body.map((l, n) => `<span style="--i:${n}">${esc(l)}</span>`).join("")}</pre>`);
        else if (/^[\s┌┐└┘├┤┬┴┼─│]+$/.test(text)) push(`<pre class="grid lettering" aria-hidden="true">${esc(text)}</pre>`);
        else push(`<pre class="grid" aria-hidden="true">${grid(text)}</pre>`);
        continue;
      }
      if (lines[i + 1] && /^=+\s*$/.test(lines[i + 1]) && line.trim()) { flush(); push(`<h2 class="slide-title">${inline(line)}</h2>`); i++; continue; }
      let m;
      if ((m = line.match(/^###\s+(.*)/))) { flush(); push(`<h3>${inline(m[1].replace(/^#+\s*/, ""))}</h3>`); continue; }
      if ((m = line.match(/^>\s?(.*)/))) { flush(); push(`<blockquote><p>${inline(m[1])}</p></blockquote>`); continue; }
      if ((m = line.match(/^-\s+(.*)/))) { flushPara(); if (!list || list.tag !== "ul") { flushList(); list = { tag: "ul", items: [] }; } list.items.push(m[1]); continue; }
      if ((m = line.match(/^(\d+)\.\s+(.*)/))) { flushPara(); if (!list || list.tag !== "ol") { flushList(); list = { tag: "ol", items: [], start: Number(m[1]) }; } list.items.push(m[2]); continue; }
      if (!line.trim()) { flush(); continue; }
      flushList(); para.push(line.trim());
    }
    flush();
    if (cols) out.push(`<div class="cols">${cols.map(c => `<div>${c.join("")}</div>`).join("")}</div>`);
    if (flags.middle) out.push('<div class="spacer"></div>');
    return { html: out.join(""), flags };
  }

  // ── build the deck ──
  let md = document.getElementById("deck-src").textContent.replace(/^\uFEFF/, "");
  md = md.replace(/^---\n[\s\S]*?\n---\n/, "");
  const chunks = md.split(/^<!--\s*end_slide\s*-->\s*$/m).filter(c => c.trim());
  const deck = document.getElementById("deck");
  const slides = chunks.map((c, n) => {
    const { html, flags } = renderSlide(c);
    const s = document.createElement("section");
    s.className = "slide";
    s.setAttribute("aria-roledescription", "slide");
    s.setAttribute("aria-label", `${n + 1} of ${chunks.length}`);
    s.innerHTML = html;
    if (flags.middle) s.classList.add("middle");
    if (s.querySelector(".figlet")) { s.classList.add("cover", "middle"); s.insertAdjacentHTML("afterbegin", '<div class="spacer"></div>'); s.insertAdjacentHTML("beforeend", '<div class="spacer"></div>'); }
    if (flags.middle && !s.querySelector(".slide-title")) s.classList.add("statement");
    deck.appendChild(s);
    return s;
  });

  // ── navigation ──
  const count = document.getElementById("count");
  const live = document.getElementById("live");
  const help = document.getElementById("help");
  let cur = -1;
  function go(n, announce = true) {
    n = Math.max(0, Math.min(slides.length - 1, n));
    if (n === cur) return;
    if (cur >= 0) slides[cur].classList.remove("is-current");
    cur = n;
    const s = slides[cur];
    s.classList.add("is-current");
    s.scrollTop = 0;
    count.textContent = `${cur + 1} / ${slides.length}`;
    document.documentElement.style.setProperty("--progress", `${((cur + 1) / slides.length) * 100}%`);
    // Sandboxed previews (and some embeds) forbid URL changes; the deck must still work.
    try { if (location.hash !== `#${cur + 1}`) history.replaceState(null, "", `#${cur + 1}`); } catch (_) {}
    if (announce) {
      const t = s.querySelector(".slide-title, blockquote, strong");
      live.textContent = `Slide ${cur + 1} of ${slides.length}${t ? ": " + t.textContent : ""}`;
    }
    fit(s);
    // Only the first view of the cover gets the print-in.
    if (cur !== 0) document.querySelectorAll(".figlet.print").forEach(f => f.classList.remove("print"));
  }
  // Shrink a diagram's type until its widest line fits the screen.
  function fit(s) {
    s.querySelectorAll("pre.grid").forEach(el => {
      el.style.fontSize = "";
      if (el.scrollWidth > el.clientWidth + 1) {
        const fs = parseFloat(getComputedStyle(el).fontSize) * el.clientWidth / el.scrollWidth * 0.97;
        el.style.fontSize = Math.max(fs, 7) + "px";
      }
    });
  }
  addEventListener("resize", () => cur >= 0 && fit(slides[cur]));
  const fromHash = () => { const n = parseInt(location.hash.slice(1), 10); return Number.isFinite(n) ? n - 1 : 0; };
  go(fromHash(), false);
  addEventListener("hashchange", () => go(fromHash()));

  const toggleHelp = open => help.classList.toggle("open", open ?? !help.classList.contains("open"));
  function toggleTheme() {
    const root = document.documentElement;
    const isDark = getComputedStyle(root).colorScheme.includes("dark");
    root.dataset.theme = isDark ? "light" : "dark";
    try { localStorage.setItem("deck-theme", root.dataset.theme); } catch (_) {}
  }
  try { const t = localStorage.getItem("deck-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}

  addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (help.classList.contains("open")) { if (k === "Escape" || k === "?") { toggleHelp(false); e.preventDefault(); } return; }
    if (["ArrowRight", "l", "j", " ", "PageDown", "Enter"].includes(k)) go(cur + 1);
    else if (["ArrowLeft", "h", "k", "PageUp", "Backspace"].includes(k)) go(cur - 1);
    else if (k === "Home" || k === "g") go(0);
    else if (k === "End" || k === "G") go(slides.length - 1);
    else if (k === "?") toggleHelp(true);
    else if (k === "t") toggleTheme();
    else if (k === "p") print();
    else return;
    e.preventDefault();
  });
  document.getElementById("prev").addEventListener("click", () => go(cur - 1));
  document.getElementById("next").addEventListener("click", () => go(cur + 1));
  help.addEventListener("click", e => { if (e.target === help) toggleHelp(false); });

  // Tap the right or left third of a slide; swipe on touch screens.
  deck.addEventListener("click", e => {
    if (e.target.closest("a, button") || getSelection().toString()) return;
    const x = e.clientX / innerWidth;
    if (x < 0.33) go(cur - 1); else go(cur + 1);
  });
  let sx = null, sy = null;
  deck.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  deck.addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(cur + (dx < 0 ? 1 : -1));
    sx = sy = null;
  }, { passive: true });
})();
</script>
